<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amity University - Lab Work 4 | Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="brand">
            <img src="images/amity-logo.png"
                 alt="Amity University Logo"
                 class="logo">

            <div>
                <h1>Amity University</h1>
                <p>Web Technologies – Lab Work 4</p>
            </div>
        </div>

        <nav>
            <a href="index.html">Home (Frame)</a>
            <a href="form.html" class="active">Form</a>
            <a href="table.php">Table</a>
        </nav>
    </header>

    <main>
        <section class="card">

            <h2>Page 2: Student Registration Form</h2>

            <p>
                When you submit, the data goes to
                <code>backend/submit.php</code>, which checks
                and saves it.
            </p>

            <div id="msg"></div>

            <form id="studentForm"
                  method="post"
                  action="backend/submit.php">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="enrollment">Enrollment No.</label>
                <input
                    type="text"
                    id="enrollment"
                    name="enrollment"
                    placeholder="e.g. A2305221001"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

                <label for="course">Course</label>
                <select id="course" name="course" required>
                    <option value="">-- Select --</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                    <option value="B.Sc IT">B.Sc IT</option>
                </select>

                <label>Gender</label>

                <div class="radio">
                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            required
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>
                </div>

                <label for="marks">Marks (0–100)</label>
                <input
                    type="number"
                    id="marks"
                    name="marks"
                    min="0"
                    max="100"
                    required
                >

                <button type="submit" class="btn">
                    Submit
                </button>

                <button type="reset" class="btn btn-grey">
                    Reset
                </button>

            </form>

        </section>
    </main>

    <footer>
        <p>
            &copy; 2026 Amity University | Lab Work 4 |
            HTML, CSS, JavaScript &amp; PHP
        </p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
